<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ColorHarbor — 配色收藏库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ColorHarbor — 暗色画廊配色收藏库
   tokens
   ============================================================ */
:root{
  --bg:#0D0D0D;
  --surface:#1A1A1A;
  --surface-solid:#161616;
  --accent:#64FFDA;
  --accent-rgb:100,255,218;
  --text:#F5F5F5;
  --text-rgb:245,245,245;
  --muted:rgba(245,245,245,.54);
  --faint:rgba(245,245,245,.32);
  --ghost:rgba(245,245,245,.16);
  --hair:rgba(255,255,255,.075);
  --hair-mid:rgba(255,255,255,.13);
  --hair-hi:rgba(255,255,255,.22);

  --font-ui:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;

  --ease-out-quart:cubic-bezier(.25,1,.5,1);
  --ease-out-expo:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,1,.36,1);

  --r-card:10px;
  --r-soft:6px;
  --shell:min(1600px,calc(100vw - 88px));
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
body.is-locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
h1,h2,h3,h4,h5,p,ul,li{margin:0;padding:0}
ul{list-style:none}
svg{display:block}
::selection{background:rgba(var(--accent-rgb),.28);color:#fff}

:focus-visible{
  outline:1px solid var(--accent);
  outline-offset:3px;
  border-radius:4px;
}

/* ---------- 画廊环境层：噪点 + 暗角 ---------- */
.env{position:fixed;inset:0;pointer-events:none;z-index:1}
.env::before{
  content:"";position:absolute;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  opacity:.05;
  mix-blend-mode:screen;
}
.env::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(130% 88% at 50% 0%,transparent 42%,rgba(0,0,0,.55) 100%);
}

/* ---------- 通用小件 ---------- */
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.tag{
  font-family:var(--font-mono);
  font-size:10px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--faint);
}
.hr{height:1px;background:var(--hair);border:0;margin:0}

/* ============================================================
   Header
   ============================================================ */
.hdr{
  position:sticky;top:0;z-index:30;
  background:rgba(13,13,13,.74);
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  border-bottom:1px solid var(--hair);
}
.hdr__shell{width:var(--shell);margin:0 auto}
.hdr__top{
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:20px 0 16px;
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand__mark{
  width:26px;height:26px;flex:none;
  display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
  gap:2px;border-radius:4px;overflow:hidden;
  box-shadow:0 0 0 1px var(--hair-mid);
}
.brand__mark i{display:block;border-radius:1px}
.brand__mark i:nth-child(1){background:#64FFDA}
.brand__mark i:nth-child(2){background:#F5F5F5}
.brand__mark i:nth-child(3){background:#1A1A1A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.brand__mark i:nth-child(4){background:#3D5AFE}
.brand__txt{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand__name{
  font-size:19px;font-weight:600;letter-spacing:-.025em;white-space:nowrap;
}
.brand__name em{font-style:normal;color:var(--accent)}
.brand__sub{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap;
}
.hdr__actions{display:flex;align-items:center;gap:10px;flex:none}

.btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  height:36px;padding:0 14px;border-radius:999px;
  border:1px solid var(--hair-mid);
  font-size:12.5px;letter-spacing:.01em;
  color:var(--muted);
  transition:color .3s var(--ease-soft),border-color .3s var(--ease-soft),background-color .3s var(--ease-soft),transform .3s var(--ease-soft);
}
.btn-ghost:hover{color:var(--text);border-color:var(--hair-hi);background:rgba(255,255,255,.035);transform:translateY(-1px)}
.btn-ghost:active{transform:translateY(0)}
.btn-ghost svg{width:15px;height:15px;flex:none}
.btn-ghost__count{
  font-family:var(--font-mono);font-size:11px;line-height:1;
  min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(var(--accent-rgb),.12);color:var(--accent);
  border:1px solid rgba(var(--accent-rgb),.24);
  transition:transform .45s var(--ease-out-expo),background-color .3s;
}
.btn-ghost__count.is-pop{animation:badgePop .55s var(--ease-out-expo)}
@keyframes badgePop{0%{transform:scale(1)}38%{transform:scale(1.34)}100%{transform:scale(1)}}
.btn-ghost__count[data-empty="1"]{background:rgba(255,255,255,.05);color:var(--faint);border-color:var(--hair)}

.hdr__bot{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding-bottom:14px;
}
.tabs{position:relative;display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs__pill{
  position:absolute;top:0;left:0;height:100%;width:0;
  border-radius:999px;
  background:rgba(var(--accent-rgb),.09);
  border:1px solid rgba(var(--accent-rgb),.3);
  transform:translateX(0);
  transition:transform .55s var(--ease-out-expo),width .55s var(--ease-out-expo),opacity .3s;
  pointer-events:none;
  will-change:transform,width;
}
.tabs button{
  position:relative;z-index:1;
  height:32px;padding:0 15px;border-radius:999px;
  font-size:13px;color:var(--muted);white-space:nowrap;
  transition:color .3s var(--ease-soft);
}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button .tabs__n{
  font-family:var(--font-mono);font-size:10px;margin-left:7px;
  color:var(--faint);transition:color .3s;
}
.tabs button[aria-selected="true"] .tabs__n{color:rgba(var(--accent-rgb),.6)}

.btn-random{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  height:32px;padding:0 14px;border-radius:999px;
  border:1px solid var(--hair-mid);color:var(--muted);
  font-size:12.5px;
  transition:color .3s,border-color .3s,background-color .3s,transform .35s var(--ease-out-quart);
}
.btn-random:hover{color:var(--accent);border-color:rgba(var(--accent-rgb),.42);background:rgba(var(--accent-rgb),.06);transform:translateY(-1px)}
.btn-random:active{transform:translateY(0) scale(.98)}
.btn-random svg{width:14px;height:14px;flex:none;transition:transform .6s var(--ease-out-expo)}
.btn-random:hover svg{transform:rotate(180deg)}

/* ============================================================
   Gallery
   ============================================================ */
.gallery{position:relative;z-index:2;width:var(--shell);margin:0 auto;padding:34px 0 40px}
.gallery__bar{
  display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  padding-bottom:22px;margin-bottom:26px;border-bottom:1px solid var(--hair);
}
.gallery__title{
  font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-family:var(--font-mono);
}
.gallery__meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;color:var(--faint)}

.grid{columns:5;column-gap:20px}
@media (max-width:1560px){.grid{columns:4}}
@media (max-width:1180px){.grid{columns:3}}
@media (max-width:760px){.grid{columns:2;column-gap:14px}}
@media (max-width:460px){.grid{columns:2;column-gap:11px}}

.card{
  break-inside:avoid;
  margin:0 0 20px;
  padding:11px;
  border-radius:var(--r-card);
  background:rgba(26,26,26,.62);
  border:1px solid var(--hair);
  position:relative;
  opacity:0;
  transform:translateY(16px);
  transition:
    opacity .7s var(--ease-out-quart) var(--d,0ms),
    transform .7s var(--ease-out-quart) var(--d,0ms),
    box-shadow .5s var(--ease-soft),
    border-color .4s var(--ease-soft),
    background-color .4s var(--ease-soft);
}
@media (max-width:760px){.card{padding:8px;margin-bottom:14px;border-radius:8px}}
.card.is-in{opacity:1;transform:translateY(0)}
.card:hover{
  z-index:3;
  background:rgba(30,30,30,.78);
  border-color:var(--hair-mid);
  transform:translateY(-5px) scale(1.014);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.1),
    0 0 40px -8px rgba(var(--glow),.5),
    0 26px 52px -26px rgba(var(--glow),.6);
}
.card:has(.card__frame:focus-visible){border-color:rgba(var(--accent-rgb),.5)}
.card.is-spot{
  animation:spotRing 1.9s var(--ease-out-quart);
  border-color:rgba(var(--accent-rgb),.55);
}
@keyframes spotRing{
  0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.55)}
  45%{box-shadow:0 0 0 6px rgba(var(--accent-rgb),0),0 0 60px -6px rgba(var(--accent-rgb),.42)}
  100%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),0)}
}

.card__frame{display:block;width:100%;padding:0;border-radius:var(--r-soft);text-align:left}
.card__art{
  display:block;position:relative;
  height:var(--h,220px);
  border-radius:var(--r-soft);
  overflow:hidden;
  background:linear-gradient(152deg,var(--c1) 0%,var(--c2) 27%,var(--c3) 52%,var(--c4) 75%,var(--c5) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  transition:box-shadow .5s var(--ease-soft),transform .6s var(--ease-out-expo);
}
.card:hover .card__art{transform:scale(1.016);box-shadow:inset 0 0 0 1px rgba(255,255,255,.34)}
.card__art::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,transparent 30%,transparent 56%,rgba(0,0,0,.26) 100%);
}
.card__strip{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;height:6px;
  border-top:1px solid rgba(0,0,0,.34);
  transition:height .5s var(--ease-out-expo);
}
.card:hover .card__strip{height:15px}
.card__strip i{flex:1;box-shadow:inset -1px 0 0 rgba(0,0,0,.28)}
.card__strip i:last-child{box-shadow:none}
.card__idx{
  position:absolute;top:9px;left:9px;z-index:2;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;
  color:rgba(255,255,255,.9);
  padding:3px 7px;border-radius:4px;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transition:background-color .4s var(--ease-soft);
}
.card:hover .card__idx{background:rgba(0,0,0,.5)}
.card__cn{
  position:absolute;left:12px;right:12px;bottom:20px;z-index:2;
  font-size:11.5px;letter-spacing:.02em;
  color:rgba(255,255,255,.78);
  text-shadow:0 1px 8px rgba(0,0,0,.55);
  opacity:0;transform:translateY(6px);
  transition:opacity .45s var(--ease-out-quart),transform .5s var(--ease-out-expo);
}
.card:hover .card__cn{opacity:1;transform:translateY(0)}

.card__plaque{display:flex;align-items:center;gap:8px;padding:12px 3px 3px}
@media (max-width:760px){.card__plaque{padding:9px 2px 2px}}
.card__info{min-width:0;flex:1}
.card__name{
  font-size:14px;font-weight:600;letter-spacing:-.012em;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card__meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.11em;color:var(--faint);margin-top:4px;text-transform:uppercase}
@media (max-width:760px){.card__name{font-size:12.5px}.card__meta{font-size:9px;letter-spacing:.07em}}

.heart{
  flex:none;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;
  color:rgba(245,245,245,.3);
  border:1px solid transparent;
  transition:color .35s var(--ease-soft),background-color .35s var(--ease-soft),border-color .35s var(--ease-soft),transform .4s var(--ease-out-quart);
}
.heart svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;overflow:visible}
.heart:hover{color:var(--text);background:rgba(255,255,255,.05);border-color:var(--hair-mid)}
.heart[aria-pressed="true"]{color:var(--accent);border-color:rgba(var(--accent-rgb),.3);background:rgba(var(--accent-rgb),.09)}
.heart[aria-pressed="true"] svg{fill:currentColor;stroke:currentColor}
.heart[aria-pressed="true"] svg path{animation:heartPop .5s var(--ease-out-quart)}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}

.gallery__empty{
  padding:90px 20px;text-align:center;border:1px dashed var(--hair-mid);border-radius:12px;
}
.gallery__empty p{color:var(--muted);font-size:13px}

.ftr{
  width:var(--shell);margin:0 auto;padding:26px 0 54px;
  border-top:1px solid var(--hair);
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;
  color:rgba(245,245,245,.24);text-transform:uppercase;
}

/* ============================================================
   Overlay scaffolding
   ============================================================ */
.veil{
  position:fixed;inset:0;z-index:60;
  opacity:0;visibility:hidden;
  transition:opacity .36s var(--ease-soft),visibility .36s;
}
.veil.is-open{opacity:1;visibility:visible}
.veil__scrim{
  position:absolute;inset:0;
  background:rgba(6,6,6,.76);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
}

/* ============================================================
   Detail view
   ============================================================ */
.detail{display:grid;place-items:center;padding:26px}
.detail__panel{
  position:relative;
  width:min(1200px,100%);
  max-height:min(90vh,880px);
  background:var(--surface-solid);
  border:1px solid var(--hair-mid);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 40px 110px -34px rgba(0,0,0,.92);
  transform:translateY(20px) scale(.985);
  opacity:0;
  transition:transform .62s var(--ease-out-expo),opacity .42s var(--ease-soft);
  display:flex;flex-direction:column;
}
.detail.is-open .detail__panel{transform:none;opacity:1}
.detail__top{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:19px 22px;border-bottom:1px solid var(--hair);flex:none;
}
.detail__id{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.detail__no{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);
}
.detail__name{font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail__cn{font-size:12.5px;color:var(--faint)}
.detail__x{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:var(--muted);border:1px solid var(--hair-mid);
  transition:color .3s,background-color .3s,transform .4s var(--ease-out-quart),border-color .3s;
}
.detail__x svg{width:14px;height:14px}
.detail__x:hover{color:var(--text);background:rgba(255,255,255,.06);border-color:var(--hair-hi);transform:rotate(90deg)}

.detail__body{
  display:grid;grid-template-columns:1.06fr .94fr;
  flex:1;min-height:0;
}
.detail__col{padding:22px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--hair-mid) transparent}
.detail__col::-webkit-scrollbar{width:8px}
.detail__col::-webkit-scrollbar-thumb{background:var(--hair-mid);border-radius:9px;border:2px solid var(--surface-solid)}
.detail__col--preview{border-left:1px solid var(--hair)}

/* --- 左：放大展示 --- */
.hero{position:relative;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.hero__art{
  position:relative;height:min(38vh,300px);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:22px 24px;
  transition:background-color .5s var(--ease-soft);
}
.hero__flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.hero__flash.is-run{animation:heroWipe .6s var(--ease-out-quart)}
@keyframes heroWipe{0%{opacity:.3}100%{opacity:0}}
.hero__label{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  opacity:.62;
}
.hero__bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.hero__hex{
  font-family:var(--font-mono);
  font-size:clamp(24px,4.6vw,50px);
  font-weight:400;letter-spacing:-.015em;line-height:1;
  text-transform:uppercase;
}
.hero__copy{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  height:38px;padding:0 17px;border-radius:999px;
  border:1px solid currentColor;font-size:12.5px;font-weight:500;
  transition:transform .35s var(--ease-out-quart),opacity .3s;
  opacity:.9;
}
.hero__copy:hover{transform:translateY(-2px);opacity:1}
.hero__copy:active{transform:translateY(0) scale(.975)}
.hero__copy svg{width:14px;height:14px}

.swatches{margin-top:11px;border-radius:10px;overflow:hidden;border:1px solid var(--hair)}
.swatch-row{display:flex;align-items:center;border-bottom:1px solid var(--hair);transition:background-color .3s var(--ease-soft)}
.swatch-row:last-child{border-bottom:0}
.swatch-row:hover{background:rgba(255,255,255,.035)}
.swatch-row.is-active{background:rgba(255,255,255,.055)}
.swatch-row.is-active .swatch__hex{color:var(--accent)}
.swatch{
  display:flex;align-items:center;gap:13px;
  flex:1;min-width:0;padding:11px 4px 11px 13px;text-align:left;
}
.swatch__chip{
  width:26px;height:26px;flex:none;border-radius:5px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
  transition:transform .4s var(--ease-out-quart),box-shadow .4s;
}
.swatch-row.is-active .swatch__chip{
  transform:scale(1.12);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 0 18px -2px currentColor;
}
.swatch__hex{
  font-family:var(--font-mono);font-size:13.5px;letter-spacing:.03em;
  transition:color .3s;
}
.swatch__role{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis}
.swatch__cp{
  width:34px;height:34px;margin-right:6px;flex:none;
  display:grid;place-items:center;color:var(--faint);border-radius:50%;
  transition:color .3s,background-color .3s,transform .35s var(--ease-out-quart);
}
.swatch__cp svg{width:13px;height:13px}
.swatch__cp:hover{color:var(--accent);background:rgba(var(--accent-rgb),.1);transform:scale(1.08)}

.detail__desc{
  margin-top:16px;padding-left:13px;border-left:1px solid rgba(var(--accent-rgb),.32);
  font-size:13px;line-height:1.7;color:var(--muted);
}
.detail__act{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.btn-line{
  display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 14px;border-radius:8px;
  border:1px solid var(--hair-mid);color:var(--muted);font-size:12.5px;
  transition:color .3s,border-color .3s,background-color .3s,transform .3s var(--ease-out-quart);
}
.btn-line:hover{color:var(--text);border-color:var(--hair-hi);background:rgba(255,255,255,.04);transform:translateY(-1px)}
.btn-line[data-on="1"]{color:var(--accent);border-color:rgba(var(--accent-rgb),.42);background:rgba(var(--accent-rgb),.08)}
.btn-line svg{width:14px;height:14px}
.btn-line svg.fill{fill:currentColor;stroke:currentColor}

/* --- 右：UI 预览 --- */
.pv{
  border-radius:12px;border:1px solid var(--hair);overflow:hidden;
  background:var(--pv-surface);
  color:rgb(var(--txt));
  transition:background-color .5s var(--ease-soft),color .5s var(--ease-soft);
}
.pv__hd{
  display:flex;align-items:center;gap:10px;
  padding:11px 15px 11px 17px;border-bottom:1px solid rgba(var(--txt),.1);
}
.pv__hd-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;opacity:.55;flex:none}
.pv__hd-name{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;opacity:.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.pv__seg{
  display:flex;gap:2px;margin-left:auto;flex:none;
  padding:2px;border-radius:999px;
  border:1px solid rgba(var(--txt),.16);
}
.pv__seg button{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;
  padding:4px 9px;border-radius:999px;
  color:rgb(var(--txt));opacity:.48;
  transition:opacity .3s var(--ease-soft),background-color .3s var(--ease-soft);
}
.pv__seg button:hover{opacity:.8}
.pv__seg button[aria-pressed="true"]{opacity:1;background:rgba(var(--txt),.14)}
.pv__row{padding:19px 17px;border-bottom:1px solid rgba(var(--txt),.08)}
.pv__row:last-child{border-bottom:0}
.pv__label{
  display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.21em;
  text-transform:uppercase;opacity:.42;margin-bottom:13px;
}
.pv__demo{display:flex;align-items:center;gap:11px;flex-wrap:wrap}

.mbtn{height:38px;padding:0 19px;border-radius:8px;font-size:13px;font-weight:500;transition:transform .3s var(--ease-out-quart),filter .3s,background-color .4s}
.mbtn--primary{background:var(--c1);color:rgb(var(--on1));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 18px -8px rgba(var(--g1),.8)}
.mbtn--primary:hover{transform:translateY(-2px);filter:brightness(1.08)}
.mbtn--ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.mbtn--ghost:hover{background:rgba(var(--g-acc),.12);transform:translateY(-2px)}

.mcard{
  width:100%;max-width:305px;border-radius:11px;overflow:hidden;
  background:var(--pv-card);color:rgb(var(--txt-c));
  border:1px solid rgba(var(--txt-c),.13);
  transition:background-color .5s var(--ease-soft),color .5s var(--ease-soft);
}
.mcard__bar{height:5px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5))}
.mcard__body{padding:15px 16px 17px}
.mcard h5{font-size:14px;font-weight:600;letter-spacing:-.012em;display:flex;align-items:center;gap:8px}
.mcard h5 i{width:9px;height:9px;border-radius:2px;background:var(--c1);display:block;flex:none}
.mcard p{font-size:12px;line-height:1.65;opacity:.62;margin-top:7px}
.mcard__tag{
  display:inline-block;margin-top:12px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;
  padding:4px 9px;border-radius:5px;
  background:rgba(var(--g-acc),.16);color:var(--acc);
  box-shadow:inset 0 0 0 1px rgba(var(--g-acc),.3);
}

.minput{
  display:block;width:100%;max-width:305px;height:40px;border-radius:9px;
  background:rgba(var(--txt),.05);
  box-shadow:inset 0 0 0 1px rgba(var(--txt),.14);
  display:flex;align-items:center;padding:0 13px;
  transition:box-shadow .3s var(--ease-soft),background-color .3s;
}
.minput:focus-within{
  background:rgba(var(--txt),.07);
  box-shadow:inset 0 0 0 1px var(--acc),0 0 0 3px rgba(var(--g-acc),.22);
}
.minput input{
  width:100%;background:none;border:0;outline:none;
  color:inherit;font-size:13px;font-family:var(--font-mono);letter-spacing:.02em;
}
.minput input::placeholder{color:rgb(var(--txt));opacity:.34}

.mrate{position:relative;display:inline-flex}
.mrate__layer{display:inline-flex;gap:3px}
.mrate__layer svg{width:17px;height:17px}
.mrate__layer--base{color:rgba(var(--txt),.18)}
.mrate__layer--fill{position:absolute;inset:0;overflow:hidden;width:90%;color:var(--acc)}
.mrate__val{font-family:var(--font-mono);font-size:12px;opacity:.6;letter-spacing:.06em}

.pv__chips{display:flex;gap:6px;margin-top:14px}
.pv__chips i{height:22px;flex:1;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(var(--txt),.14)}

/* --- 对比度检查 --- */
.checks{margin-top:14px;border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.checks__hd{
  padding:11px 15px;border-bottom:1px solid var(--hair);
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--faint);
}
.checks li{
  display:flex;align-items:center;gap:11px;
  padding:11px 15px;border-bottom:1px solid var(--hair);
}
.checks li:last-child{border-bottom:0}
.check__pair{display:flex;align-items:center;gap:5px;flex:none}
.check__sw{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.check__vs{font-family:var(--font-mono);font-size:10px;color:var(--faint)}
.check__label{flex:1;min-width:0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check__ratio{font-family:var(--font-mono);font-size:12px;letter-spacing:.03em;flex:none}
.check__badge{
  flex:none;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;
  padding:3px 7px;border-radius:4px;border:1px solid;
}
.check__badge[data-lv="aaa"]{color:#5BE7A9;border-color:rgba(91,231,169,.32);background:rgba(91,231,169,.1)}
.check__badge[data-lv="aa"]{color:#64D2FF;border-color:rgba(100,210,255,.32);background:rgba(100,210,255,.1)}
.check__badge[data-lv="lg"]{color:#FFD166;border-color:rgba(255,209,102,.32);background:rgba(255,209,102,.1)}
.check__badge[data-lv="no"]{color:#FF8A8A;border-color:rgba(255,138,138,.32);background:rgba(255,138,138,.1)}

/* ============================================================
   Favorites drawer
   ============================================================ */
.drawer{display:flex;justify-content:flex-end}
.drawer__panel{
  position:relative;
  width:min(392px,100%);height:100%;
  background:var(--surface-solid);
  border-left:1px solid var(--hair-mid);
  display:flex;flex-direction:column;
  transform:translateX(103%);
  transition:transform .68s var(--ease-out-expo);
  box-shadow:-40px 0 90px -40px rgba(0,0,0,.9);
}
.drawer.is-open .drawer__panel{transform:none}
.drawer__hd{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:21px 20px 17px;border-bottom:1px solid var(--hair);flex:none;
}
.drawer__title{font-size:15px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.drawer__title svg{width:16px;height:16px;fill:var(--accent);stroke:var(--accent)}
.drawer__n{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:.1em}
.drawer__list{flex:1;overflow-y:auto;padding:13px;scrollbar-width:thin;scrollbar-color:var(--hair-mid) transparent}
.drawer__list::-webkit-scrollbar{width:8px}
.drawer__list::-webkit-scrollbar-thumb{background:var(--hair-mid);border-radius:9px;border:2px solid var(--surface-solid)}

.fav{
  display:flex;align-items:center;gap:12px;
  padding:11px;border-radius:9px;margin-bottom:7px;
  border:1px solid var(--hair);
  transition:border-color .35s var(--ease-soft),background-color .35s var(--ease-soft),transform .4s var(--ease-out-quart);
  animation:favIn .5s var(--ease-out-quart) both;
}
@keyframes favIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.fav:hover{border-color:var(--hair-mid);background:rgba(255,255,255,.032);transform:translateX(-2px)}
.fav__open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:0}
.fav__strip{
  width:38px;height:34px;border-radius:5px;overflow:hidden;flex:none;
  display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
}
.fav__strip i{flex:1}
.fav__info{min-width:0;flex:1}
.fav__name{display:block;font-size:13px;font-weight:500;letter-spacing:-.008em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav__hex{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--faint);letter-spacing:.09em;margin-top:4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav__x{
  width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:var(--ghost);transition:color .3s,background-color .3s;
}
.fav__x svg{width:13px;height:13px}
.fav__x:hover{color:#ff7a7a;background:rgba(255,122,122,.1)}

.drawer__empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;
  height:100%;padding:40px 34px;text-align:center;
}
.drawer__empty svg{width:74px;height:74px;color:rgba(245,245,245,.19)}
.drawer__empty h4{font-size:14px;font-weight:600;letter-spacing:-.01em}
.drawer__empty p{font-size:12.5px;line-height:1.75;color:var(--faint);max-width:236px}
.drawer__empty kbd{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  padding:3px 7px;border-radius:5px;
  background:rgba(255,255,255,.05);border:1px solid var(--hair-mid);color:var(--muted);
}
.drawer__ft{
  flex:none;padding:15px 20px 19px;border-top:1px solid var(--hair);
  display:flex;gap:9px;
}
.drawer__ft .btn-line{flex:1;justify-content:center}

/* ============================================================
   Toasts
   ============================================================ */
.toasts{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;
}
.toast{
  display:inline-flex;align-items:center;gap:10px;
  padding:10px 17px;border-radius:999px;
  background:rgba(22,22,22,.94);
  border:1px solid rgba(var(--accent-rgb),.3);
  box-shadow:0 14px 40px -14px rgba(0,0,0,.9),0 0 34px -14px rgba(var(--accent-rgb),.5);
  font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;
  color:var(--text);
  backdrop-filter:blur(12px);
  animation:toastIn .5s var(--ease-out-expo);
}
.toast.is-out{animation:toastOut .34s var(--ease-soft) forwards}
.toast__dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 10px rgba(var(--accent-rgb),.9)}
.toast b{color:var(--accent);font-weight:500}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:980px){
  :root{--shell:calc(100vw - 40px)}
  .hdr__top{padding:16px 0 12px}
  .brand__sub{display:none}
  .detail{padding:0}
  .detail__panel{width:100%;max-height:100vh;height:100%;border-radius:0;border-left:0;border-right:0}
  .detail__body{grid-template-columns:1fr;grid-template-rows:auto auto;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--hair-mid) transparent}
  .detail__col{overflow:visible}
  .detail__col--preview{border-left:0;border-top:1px solid var(--hair)}
  .drawer__panel{width:min(360px,90vw)}
}
@media (max-width:560px){
  :root{--shell:calc(100vw - 26px)}
  .brand__name{font-size:16.5px}
  .btn-ghost span:not(.btn-ghost__count){display:none}
  .btn-ghost{padding:0 11px}
  .hdr__bot{gap:10px}
  .tabs button{padding:0 12px;font-size:12px}
  .tabs button .tabs__n{display:none}
  .btn-random span{display:none}
  .btn-random{padding:0 11px}
  .gallery{padding-top:24px}
  .ftr{flex-direction:column;align-items:flex-start;gap:8px}
  .hero__art{height:180px;padding:16px 17px}
  .hero__bottom{gap:12px}
  .pv__hd{flex-wrap:wrap;row-gap:9px}
  .pv__seg{margin-left:0}
  .detail__col{padding:16px}
  .checks li{gap:8px;padding:10px 12px}
  .check__label{font-size:11px}
  .toasts{bottom:16px;width:calc(100vw - 28px)}
  .toast{font-size:11px;padding:9px 14px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .card{opacity:1;transform:none}
  .card:hover{transform:none}
}
</style>
</head>
<body>

<div class="env" aria-hidden="true"></div>

<!-- ============ Header ============ -->
<header class="hdr">
  <div class="hdr__shell">
    <div class="hdr__top">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand__txt">
          <h1 class="brand__name">Color<em>Harbor</em></h1>
          <span class="brand__sub">Palette Archive</span>
        </span>
      </div>
      <div class="hdr__actions">
        <button class="btn-ghost" id="openFavs" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20.7l-1.1-1C6 15.4 3 12.7 3 9.4A4.9 4.9 0 0 1 7.9 4.5 5.4 5.4 0 0 1 12 6.5a5.4 5.4 0 0 1 4.1-2A4.9 4.9 0 0 1 21 9.4c0 3.3-3 6-7.9 10.3z"/>
          </svg>
          <span>收藏夹</span>
          <span class="btn-ghost__count mono" id="favCount" data-empty="1">0</span>
        </button>
      </div>
    </div>
    <div class="hdr__bot">
      <nav class="tabs" id="tabs" role="tablist" aria-label="配色分类">
        <span class="tabs__pill" id="tabsPill" aria-hidden="true"></span>
      </nav>
      <button class="btn-random" id="randomBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
        </svg>
        <span>随机发现</span>
      </button>
    </div>
  </div>
</header>

<!-- ============ Gallery ============ -->
<main class="gallery">
  <div class="gallery__bar">
    <span class="gallery__title" id="galleryTitle">All Palettes</span>
    <span class="gallery__meta" id="galleryMeta">26 PALETTES</span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer class="ftr">
  <span>ColorHarbor — 点击任意色块进入详情</span>
  <span id="ftrRight">LOCAL · 26 PALETTES</span>
</footer>

<!-- ============ Detail overlay ============ -->
<div class="veil detail" id="detail" role="dialog" aria-modal="true" aria-label="配色详情" aria-hidden="true">
  <div class="veil__scrim" data-close></div>
  <div class="detail__panel">
    <div class="detail__top">
      <div class="detail__id">
        <span class="detail__no" id="dNo">No.01</span>
        <h2 class="detail__name" id="dName">—</h2>
        <span class="detail__cn" id="dCn">—</span>
      </div>
      <button class="detail__x" id="detailClose" aria-label="关闭详情">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="detail__body">
      <div class="detail__col">
        <div class="hero">
          <div class="hero__art" id="heroArt">
            <div class="hero__flash" id="heroFlash"></div>
            <span class="hero__label">Selected Color</span>
            <div class="hero__bottom">
              <span class="hero__hex" id="heroHex">#FFFFFF</span>
              <button class="hero__copy" id="heroCopy">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M6 15H5a1.8 1.8 0 0 1-1.8-1.8V5A1.8 1.8 0 0 1 5 3.2h7.2A1.8 1.8 0 0 1 14 5v1"/>
                </svg>
                <span id="heroCopyTxt">复制</span>
              </button>
            </div>
          </div>
        </div>
        <ul class="swatches" id="swatchList"></ul>
        <p class="detail__desc" id="dDesc"></p>
        <div class="detail__act">
          <button class="btn-line" id="dCopyAll">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M6 15H5a1.8 1.8 0 0 1-1.8-1.8V5A1.8 1.8 0 0 1 5 3.2h7.2A1.8 1.8 0 0 1 14 5v1"/>
            </svg>
            复制全部色值
          </button>
          <button class="btn-line" id="dFav">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20.7l-1.1-1C6 15.4 3 12.7 3 9.4A4.9 4.9 0 0 1 7.9 4.5 5.4 5.4 0 0 1 12 6.5a5.4 5.4 0 0 1 4.1-2A4.9 4.9 0 0 1 21 9.4c0 3.3-3 6-7.9 10.3z"/>
            </svg>
            <span id="dFavTxt">收藏</span>
          </button>
        </div>
      </div>
      <div class="detail__col detail__col--preview">
        <div class="pv" id="pv">
          <div class="pv__hd">
            <span class="pv__hd-label">UI Preview</span>
            <span class="pv__hd-name" id="pvName">—</span>
            <div class="pv__seg" role="group" aria-label="预览底色">
              <button type="button" data-pv="dark" aria-pressed="true">暗底</button>
              <button type="button" data-pv="light" aria-pressed="false">亮底</button>
            </div>
          </div>
          <div class="pv__row">
            <span class="pv__label">Button</span>
            <div class="pv__demo">
              <button class="mbtn mbtn--primary">开始探索</button>
              <button class="mbtn mbtn--ghost">了解更多</button>
            </div>
          </div>
          <div class="pv__row">
            <span class="pv__label">Card</span>
            <div class="pv__demo">
              <div class="mcard">
                <div class="mcard__bar"></div>
                <div class="mcard__body">
                  <h5><i></i><span id="pvCardTitle">Palette</span></h5>
                  <p id="pvCardText">用这组配色渲染的卡片表面，文字对比度已自动计算。</p>
                  <span class="mcard__tag">COLLECTION</span>
                </div>
              </div>
            </div>
          </div>
          <div class="pv__row">
            <span class="pv__label">Input</span>
            <div class="pv__demo">
              <label class="minput">
                <input type="text" id="pvInput" placeholder="输入色值，如 #64FFDA" aria-label="色值输入示例">
              </label>
            </div>
          </div>
          <div class="pv__row">
            <span class="pv__label">Rating</span>
            <div class="pv__demo">
              <span class="mrate" role="img" aria-label="评分 4.5 / 5">
                <span class="mrate__layer mrate__layer--base" id="rateBase"></span>
                <span class="mrate__layer mrate__layer--fill" id="rateFill"></span>
              </span>
              <span class="mrate__val">4.5</span>
            </div>
            <div class="pv__chips" id="pvChips"></div>
          </div>
        </div>

        <div class="checks">
          <div class="checks__hd">对比度检查 · WCAG</div>
          <ul id="checkList"></ul>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ Favorites drawer ============ -->
<div class="veil drawer" id="drawer" role="dialog" aria-modal="true" aria-label="收藏夹" aria-hidden="true">
  <div class="veil__scrim" data-close></div>
  <div class="drawer__panel">
    <div class="drawer__hd">
      <h2 class="drawer__title">
        <svg viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20.7l-1.1-1C6 15.4 3 12.7 3 9.4A4.9 4.9 0 0 1 7.9 4.5 5.4 5.4 0 0 1 12 6.5a5.4 5.4 0 0 1 4.1-2A4.9 4.9 0 0 1 21 9.4c0 3.3-3 6-7.9 10.3z"/>
        </svg>
        收藏夹

   2 · COLOR UTILS
   ============================================================ */
function hexToRgb(h){
  var n=parseInt(h.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgbStr(h){var c=hexToRgb(h);return c[0]+','+c[1]+','+c[2];}
function relLum(h){
  var c=hexToRgb(h).map(function(v){
    v/=255;return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
  });
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
function onColor(h){return relLum(h)>0.42?'13,13,13':'245,245,245';}
function mix(a,b,t){
  var x=hexToRgb(a),y=hexToRgb(b),o=[0,0,0];
  for(var i=0;i<3;i++) o[i]=Math.round(x[i]+(y[i]-x[i])*t);
  return '#'+o.map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');
}

}

var tabsEl=document.getElementById('tabs');
var pillEl=document.getElementById('tabsPill');

function buildTabs(){
  var frag=document.createDocumentFragment();
  CATS.forEach(function(c){
    var n=c.id==='all'?PALETTES.length:PALETTES.filter(function(p){return p.cat===c.id;}).length;
    var b=document.createElement('button');
    b.type='button';
    b.setAttribute('role','tab');
    b.dataset.cat=c.id;
    b.setAttribute('aria-selected',c.id===state.filter?'true':'false');
    b.innerHTML=c.label+'<span class="tabs__n">'+n+'</span>';
    b.addEventListener('click',function(){setFilter(c.id);});
    frag.appendChild(b);
  });
  tabsEl.appendChild(frag);
  requestAnimationFrame(function(){movePill(false);});
}
function movePill(animate){
  var active=tabsEl.querySelector('button[aria-selected="true"]');
  if(!active) return;
  var cr=tabsEl.getBoundingClientRect();
  var br=active.getBoundingClientRect();
  if(!animate) pillEl.style.transition='none';
  pillEl.style.width=br.width+'px';
  pillEl.style.transform='translateX('+(br.left-cr.left+tabsEl.scrollLeft)+'px)';
  if(!animate){
    void pillEl.offsetWidth;
    requestAnimationFrame(function(){pillEl.style.transition='';});
  }
}
if(window.ResizeObserver){
  new ResizeObserver(function(){movePill(false);}).observe(tabsEl);
}
tabsEl.addEventListener('scroll',function(){movePill(false);},{passive:true});
window.addEventListener('resize',function(){movePill(false);});
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){movePill(false);});}

function setFilter(cat){
  if(state.filter===cat) return;
  state.filter=cat;
  Array.prototype.forEach.call(tabsEl.querySelectorAll('button'),function(b){
    b.setAttribute('aria-selected',b.dataset.cat===cat?'true':'false');
  });
  movePill(true);
  renderGrid();
  var c=CATS.filter(function(x){return x.id===cat;})[0];
  document.getElementById('galleryTitle').textContent=cat==='all'?'All Palettes':(c.label+' Palettes');
}

var io=window.IntersectionObserver?new IntersectionObserver(function(entries){

  });
},{rootMargin:'0px 0px -6% 0px',threshold:0.04}):null;

function currentList(){

function renderGrid(){

          '<span class="card__idx mono">No.'+('0'+p.no).slice(-2)+'</span>'+
          '<span class="card__cn">'+p.cn+'</span>'+
          '<span class="card__strip">'+strip+'</span>'+
        '</span>'+
      '</button>'+
      '<div class="card__plaque">'+
        '<div class="card__info">'+
          '<h3 class="card__name">'+p.name+'</h3>'+
          '<div class="card__meta">'+CAT_LABEL[p.cat]+' · '+p.hex[0]+'</div>'+

      '</div>'+
    '</article>';
  }).join('');
  gridEl.innerHTML=html;
  updateMeta(list.length);

  requestAnimationFrame(function(){
    Array.prototype.forEach.call(gridEl.querySelectorAll('.card'),function(c,i){
      if(io){io.observe(c);}
      else{c.classList.add('is-in');}
      if(i<24){setTimeout(function(){c.classList.add('is-in');},20+i*24);}
    });
  });
}

function updateMeta(n){

function contrastRatio(a,b){
  var l1=relLum(a),l2=relLum(b);
  if(l1<l2){var t=l1;l1=l2;l2=t;}
  return (l1+0.05)/(l2+0.05);
}
function wcag(r){
  if(r>=7)   return {lv:'aaa',txt:'AAA'};
  if(r>=4.5) return {lv:'aa', txt:'AA'};
  if(r>=3)   return {lv:'lg', txt:'AA LG'};
  return {lv:'no', txt:'不足'};
}
/* 从配色中挑出与底色对比度最高的那个颜色，用于星星 / 标签 / 焦点环 */
function bestAccent(p,surf){
  var best=p.hex[0],bd=-1;
  p.hex.forEach(function(h){
    var d=Math.abs(relLum(h)-relLum(surf));
    if(d>bd){bd=d;best=h;}
  });
  return best;
}

function paintPreview(p){
  var dark=state.pvMode!=='light';
  var base=dark?'#141414':'#F5F5F5';
  var surf=mix(base,p.hex[0],dark?0.16:0.09);
  var card=mix(surf,p.hex[1],dark?0.24:0.15);
  var acc=bestAccent(p,surf);
  var txt=onColor(surf);

  pv.style.setProperty('--c1',p.hex[0]);pv.style.setProperty('--c2',p.hex[1]);
  pv.style.setProperty('--c3',p.hex[2]);pv.style.setProperty('--c4',p.hex[3]);pv.style.setProperty('--c5',p.hex[4]);
  pv.style.setProperty('--g1',rgbStr(p.hex[0]));pv.style.setProperty('--g2',rgbStr(p.hex[1]));
  pv.style.setProperty('--pv-surface',surf);
  pv.style.setProperty('--pv-card',card);
  pv.style.setProperty('--txt',txt);
  pv.style.setProperty('--txt-c',onColor(card));
  pv.style.setProperty('--on1',onColor(p.hex[0]));
  pv.style.setProperty('--acc',acc);
  pv.style.setProperty('--g-acc',rgbStr(acc));

  // 评分星
  var stars='';for(var i=0;i<5;i++) stars+=I.star;
  document.getElementById('rateBase').innerHTML=stars;
  document.getElementById('rateFill').innerHTML=stars;

  // 底部色卡
  document.getElementById('pvChips').innerHTML=p.hex.map(function(h){return '<i style="background:'+h+'"></i>';}).join('');

  document.getElementById('pvName').textContent=p.name.toUpperCase();
  document.getElementById('pvCardTitle').textContent=p.name;
  document.getElementById('pvInput').placeholder='输入色值，如 '+p.hex[0];
}

/* 对比度检查面板 */
function renderChecks(p){
  var rows=[
    {a:p.hex[0],b:'#F5F5F5',label:'主色底 · 浅色正文'},
    {a:p.hex[0],b:'#0D0D0D',label:'主色底 · 深色正文'},
    {a:p.hex[0],b:p.hex[4], label:'主色 × 末色（分隔线）'}
  ];
  document.getElementById('checkList').innerHTML=rows.map(function(r){
    var ratio=contrastRatio(r.a,r.b);
    var lv=wcag(ratio);
    return ''+
    '<li>'+
      '<span class="check__pair">'+
        '<span class="check__sw" style="background:'+r.a+'"></span>'+
        '<span class="check__vs">×</span>'+
        '<span class="check__sw" style="background:'+r.b+'"></span>'+
      '</span>'+
      '<span class="check__label">'+r.label+'</span>'+
      '<span class="check__ratio">'+ratio.toFixed(2)+':1</span>'+
      '<span class="check__badge" data-lv="'+lv.lv+'">'+lv.txt+'</span>'+
    '</li>';
  }).join('');
}

function renderHero(){
  var p=BY_ID[state.detailId];
  var h=p.hex[state.heroIndex];
  heroArt.style.background=h;
  heroArt.style.color='rgb('+onColor(h)+')';
  heroHex.textContent=h.toUpperCase();
  heroFlash.classList.remove('is-run');
  void heroFlash.offsetWidth;
  heroFlash.classList.add('is-run');

  Array.prototype.forEach.call(swatchList.querySelectorAll('.swatch-row'),function(el,i){
    el.classList.toggle('is-active',i===state.heroIndex);
  });
  heroCopyTxt.textContent='复制';
}

function openDetail(id){
  var p=BY_ID[id];if(!p) return;
  state.detailId=id;state.heroIndex=0;state.lastFocus=document.activeElement;

  document.getElementById('dNo').textContent='No.'+('0'+p.no).slice(-2);
  document.getElementById('dName').textContent=p.name;
  document.getElementById('dCn').textContent=p.cn+' · '+CAT_LABEL[p.cat];
  document.getElementById('dDesc').textContent=p.desc;
  Array.prototype.forEach.call(pvSeg.querySelectorAll('button'),function(x){
    x.setAttribute('aria-pressed',x.dataset.pv===state.pvMode?'true':'false');
  });

  swatchList.innerHTML=p.hex.map(function(h,i){
    var H=h.toUpperCase();
    return ''+
    '<li class="swatch-row" style="--glow:'+rgbStr(h)+'">'+
      '<button class="swatch" type="button" data-hi="'+i+'" aria-label="放大展示 '+H+'">'+
        '<span class="swatch__chip" style="background:'+h+';color:'+h+'"></span>'+
        '<span class="swatch__hex">'+H+'</span>'+
        '<span class="swatch__role">'+ROLES[i]+'</span>'+
      '</button>'+
      '<button class="swatch__cp" type="button" data-copy="'+h+'" aria-label="复制 '+H+'">'+I.copy+'</button>'+
    '</li>';
  }).join('');

  paintPreview(p);
  renderChecks(p);
  renderHero();
  syncDetailFav();

  detailEl.classList.add('is-open');
  detailEl.setAttribute('aria-hidden','false');
  document.body.classList.add('is-locked');
  setTimeout(function(){document.getElementById('detailClose').focus();},80);
}
function syncDetailFav(){
  var on=isFav(state.detailId);
  var b=document.getElementById('dFav');
  b.dataset.on=on?'1':'0';
  document.getElementById('dFavTxt').textContent=on?'已收藏':'收藏';
}
function closeDetail(){
  detailEl.classList.remove('is-open');
  detailEl.setAttribute('aria-hidden','true');
  document.body.classList.remove('is-locked');
  state.detailId=null;
  if(state.lastFocus&&state.lastFocus.focus){try{state.lastFocus.focus();}catch(e){}}
}

swatchList.addEventListener('click',function(e){
  var cp=e.target.closest('[data-copy]');
  if(cp){
    var hex=cp.dataset.copy.toUpperCase();
    copyText(hex);
    toast('已复制 <b>'+hex+'</b>');
    return;
  }
  var row=e.target.closest('[data-hi]');
  if(row){
    var i=parseInt(row.dataset.hi,10);
    if(i===state.heroIndex) return;
    state.heroIndex=i;
    renderHero();
  }
});

heroCopyBtn.addEventListener('click',function(){
  var p=BY_ID[state.detailId];if(!p) return;
  var hex=p.hex[state.heroIndex].toUpperCase();
  copyText(hex);
  heroCopyTxt.textContent='已复制';
  toast('已复制 <b>'+hex+'</b>');
  setTimeout(function(){heroCopyTxt.textContent='复制';},1400);
});

document.getElementById('dCopyAll').addEventListener('click',function(){
  var p=BY_ID[state.detailId];if(!p) return;
  copyText(p.name+' · '+p.cn+'\n'+p.hex.map(function(h){return h.toUpperCase();}).join('  '));
  toast('已复制 <b>'+p.name+'</b> 的全部色值');
});

document.getElementById('dFav').addEventListener('click',function(){
  var id=state.detailId;if(!id) return;
  var added=toggleFav(id);
  popBadge();
  var btn=document.querySelector('[data-fav="'+id+'"]');
  if(btn){
    btn.setAttribute('aria-pressed',isFav(id)?'true':'false');
    btn.setAttribute('aria-label',(isFav(id)?'取消收藏 ':'收藏 ')+BY_ID[id].name);
  }
  toast(added?'已收藏 <b>'+BY_ID[id].name+'</b>':'已移出收藏 <b>'+BY_ID[id].name+'</b>');
});

document.getElementById('detailClose').addEventListener('click',closeDetail);

/* ============================================================
   9 · DRAWER
   ============================================================ */
var drawerEl=document.getElementById('drawer');
var drawerLastFocus=null;

function openDrawer(){
  drawerLastFocus=document.activeElement;
  renderDrawer();
  drawerEl.classList.add('is-open');
  drawerEl.setAttribute('aria-hidden','false');
  document.body.classList.add('is-locked');
  setTimeout(function(){document.getElementById('drawerClose').focus();},80);
}
function closeDrawer(){
  drawerEl.classList.remove('is-open');
  drawerEl.setAttribute('aria-hidden','true');
  if(!detailEl.classList.contains('is-open')) document.body.classList.remove('is-locked');
  if(drawerLastFocus&&drawerLastFocus.focus){try{drawerLastFocus.focus();}catch(e){}}
}
document.getElementById('openFavs').addEventListener('click',openDrawer);
document.getElementById('drawerClose').addEventListener('click',closeDrawer);

document.getElementById('favCopyAll').addEventListener('click',function(){
  if(!state.favs.length) return;
  var text=state.favs.map(function(id){
    var p=BY_ID[id];
    return p.name+' · '+p.cn+'\n'+p.hex.map(function(h){return h.toUpperCase();}).join('  ');
  }).join('\n\n');
  copyText(text);
  toast('已导出 <b>'+state.favs.length+'</b> 组配色');
});

document.getElementById('favClear').addEventListener('click',function(){
  if(!state.favs.length) return;
  var n=state.favs.length;
  state.favs=[];
  saveFavs();syncFavs();renderDrawer();syncGridHearts();popBadge();
  toast('已清空 <b>'+n+'</b> 组收藏');
});

function syncGridHearts(){
  Array.prototype.forEach.call(gridEl.querySelectorAll('[data-fav]'),function(btn){
    var id=btn.dataset.fav,on=isFav(id);
    btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',(on?'取消收藏 ':'收藏 ')+BY_ID[id].name);
  });
}

/* 遮罩点击关闭 */
Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(scrim){
  scrim.addEventListener('click',function(){
    if(detailEl.classList.contains('is-open')) closeDetail();
    if(drawerEl.classList.contains('is-open')) closeDrawer();
  });
});

/* ============================================================
   10 · RANDOM DISCOVER
   ============================================================ */
document.getElementById('randomBtn').addEventListener('click',function(){
  var list=currentList();
  if(!list.length) return;
  var p=list[Math.floor(Math.random()*list.length)];
  var node=gridEl.querySelector('.card[data-id="'+p.id+'"]');
  if(!node) return;
  node.classList.remove('is-in','is-spot');
  node.style.setProperty('--d','0ms');
  void node.offsetWidth;
  node.classList.add('is-in','is-spot');
  if(node.scrollIntoView){
    try{node.scrollIntoView({behavior:'smooth',block:'center'});}
    catch(e){node.scrollIntoView();}
  }
  setTimeout(function(){node.classList.remove('is-spot');},2000);
  toast('翻出一张 · <b>'+p.name+'</b>');
});

/* ============================================================
   11 · UTILITIES
   ============================================================ */
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){fallbackCopy(text);});
  }else{fallbackCopy(text);}
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed';
  ta.style.top='-1000px';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}

var toastsEl=document.getElementById('toasts');
function toast(html){
  var el=document.createElement('div');
  el.className='toast';
  el.innerHTML='<span class="toast__dot"></span><span>'+html+'</span>';
  toastsEl.appendChild(el);
  setTimeout(function(){
    el.classList.add('is-out');
    setTimeout(function(){if(el.parentNode) el.parentNode.removeChild(el);},360);
  },2100);
  while(toastsEl.children.length>3) toastsEl.removeChild(toastsEl.firstChild);
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(detailEl.classList.contains('is-open')) closeDetail();
    else if(drawerEl.classList.contains('is-open')) closeDrawer();
  }
});

/* ============================================================
   12 · BOOT
   ============================================================ */
buildTabs();
renderGrid();
syncFavs();

/* 首屏轻微入场：让 header 各元素依次淡入 */
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.documentElement.style.setProperty('scroll-behavior','smooth');
}
})();
</script>
</body>
